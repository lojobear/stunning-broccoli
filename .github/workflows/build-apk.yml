name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Align Expo dependencies
        working-directory: mobile
        run: npx expo install --fix

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android

      - name: Add free offline Android engine
        working-directory: mobile
        run: |
          node scripts/patch-native.cjs
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/ai-edge/interpreter-samples/super_resolution/android/ESRGAN.tflite \
            --output android/app/src/main/assets/ESRGAN.tflite
          test -s android/app/src/main/assets/ESRGAN.tflite

      - name: Embed standalone JavaScript bundle
        working-directory: mobile
        env:
          NODE_ENV: production
          CI: '1'
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --minify true
          test -s android/app/src/main/assets/index.android.bundle

      - name: Build standalone offline APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify offline engine is packaged
        run: |
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/index.android.bundle|index.android.bundle'
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/ESRGAN.tflite'

      - name: Prepare APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ClarityForge-offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClarityForge-Offline-APK
          path: ClarityForge-offline.apk
          if-no-files-found: error
          retention-days: 30
