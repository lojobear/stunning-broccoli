name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Align Expo dependencies
        working-directory: mobile
        run: npx expo install --fix

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android

      - name: Build installable debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ClarityForge-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClarityForge-APK
          path: ClarityForge-debug.apk
          if-no-files-found: error
          retention-days: 30
